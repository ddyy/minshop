name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      - name: Install MCP dependencies
        run: npm ci --prefix mcp

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Run complete verification
        run: npm run verify

  # Which sets exist is a property of the TREE, not of this file: a generated
  # store carries its merchant-owned set plus whatever shipped sets it kept,
  # and a hardcoded list here would silently stop covering them. Discovery
  # asks the same resolver the build uses.
  discover:
    name: Discover storefront sets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sets: ${{ steps.discover.outputs.sets }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List sets not covered by the main job
        id: discover
        run: |
          sets=$(node --input-type=module -e "
            import { discoverSetIds, resolveConfiguredSet } from './scripts/storefront-set.mjs';
            const configured = resolveConfiguredSet().id;
            console.log(JSON.stringify(discoverSetIds().filter((id) => id !== configured)));
          ")
          echo "discovered: $sets"
          echo "sets=$sets" >> "$GITHUB_OUTPUT"

  # The main job verifies whichever set storefront.config.json names. The
  # contract suite exists precisely to hold for ANY design — so run it against
  # every other set in the tree. Not the full `verify`: the parts this omits
  # (integration, MCP, scaffold, Stripe country data) are set-independent and
  # would only multiply the bill.
  sets:
    name: Verify set (${{ matrix.set }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover
    if: needs.discover.outputs.sets != '[]'

    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.discover.outputs.sets) }}

    env:
      STOREFRONT: ${{ matrix.set }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Verify the set builds and honours the contract
        run: npm run verify:set
